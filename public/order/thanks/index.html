    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 5.5A2.5 2.5 0 016.5 3h11A2.5 2.5 0 0120 5.5v8a2.5 2.5 0 01-2.5 2.5H10l-4.5 4v-4h0A1.5 1.5 0 014 14.5z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"></path></svg>
    <sc-if value="{{ pUnread }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:#FFFFFF;color:#151515;border:2px solid #151515;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center">1</span></sc-if>
  </button>
</sc-if>
</sc-if>

<sc-if value="{{ isOrder }}" hint-placeholder-val="{{ false }}">
<section data-screen-label="Order wizard" style="padding:clamp(20px,4vw,48px) clamp(0px,1.2vw,16px) 24px;display:grid;grid-template-columns:{{ gridCols }};justify-content:center;gap:20px;align-items:start">
  <div style="display:flex;flex-direction:column;gap:20px;min-width:0">
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:560px">
      <sc-for list="{{ stepTabs }}" as="s" hint-placeholder-count="4">
        <button onClick="{{ s.go }}" style="border:0;cursor:pointer;border-radius:14px;padding:10px clamp(8px,1.2vw,16px);font-size:clamp(12px,1.2vw,14px);font-weight:500;display:flex;gap:6px;align-items:center;justify-content:center;background:{{ s.bg }};color:{{ s.fg }}"><span style="font-family:'Geist Mono',monospace;font-size:12px;opacity:.7">0{{ s.n }}</span>{{ s.label }}</button>
      </sc-for>
    </div>


    <sc-if value="{{ showStep1 }}" hint-placeholder-val="{{ true }}">
      <div style="padding:8px 4px"><h1 style="margin:0;font-size:clamp(34px,4vw,52px);font-weight:500;letter-spacing:-.04em;line-height:1"><span style="color:#9E9E9E">Find your</span> business.</h1></div>
      <div style="background:#FFFFFF;border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <input value="{{ bizQuery }}" onChange="{{ onBizQuery }}" onKeyDown="{{ onBizKey }}" placeholder="Business name or Google profile link" style="flex:1;min-width:220px;border:0;background:#F4F4F4;border-radius:14px;padding:16px 18px;font-size:16px;outline:none">
          <button onClick="{{ findBiz }}" style="border:0;cursor:pointer;background:#151515;color:#fff;border-radius:14px;padding:16px 22px;font-size:15px;font-weight:500">Find</button>
        </div>
        <sc-if value="{{ bizLoading }}" hint-placeholder-val="{{ false }}">
          <div style="background:#F4F4F4;border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px"><span style="width:48px;height:48px;border-radius:12px;background:#E4E4E4;flex:none"></span><div style="flex:1;display:flex;flex-direction:column;gap:8px"><span style="height:10px;width:40%;background:#E4E4E4;border-radius:5px;display:block"></span><span style="height:10px;width:60%;background:#E4E4E4;border-radius:5px;display:block"></span></div><span style="font-family:'Geist Mono',monospace;font-size:12px;color:#8A8A8A">searching google…</span></div>
        </sc-if>
        <sc-if value="{{ bizChoose }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;flex-direction:column;gap:8px">
            <span style="font-size:14px;color:#6B6B6B;padding:2px 4px">{{ chooseTitle }}</span>
            <sc-for list="{{ choosePlaces }}" as="cp" hint-placeholder-count="3">
              <button onClick="{{ cp.go }}" style="width:100%;text-align:left;border:0;cursor:pointer;background:#F4F4F4;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:14px;color:#151515">
                <span style="width:44px;height:44px;border-radius:12px;background:#151515;color:#fff;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:500">{{ cp.initial }}</span>
                <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;font-weight:500">{{ cp.name }}</span><span style="font-size:13px;color:#6B6B6B">{{ cp.meta }}</span></span>
                <span style="flex:none;font-size:13px;font-weight:500;background:#FFFFFF;border-radius:10px;padding:8px 12px">Select</span>
              </button>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ bizFound }}" hint-placeholder-val="{{ false }}">
          <div style="background:#F4F4F4;border-radius:16px;padding:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
            <span style="width:48px;height:48px;border-radius:12px;background:#151515;color:#fff;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:500">{{ bizInitial }}</span>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:17px;font-weight:500">{{ bizName }}</span><span style="font-size:13px;color:#6B6B6B">{{ bizMeta }}</span></div>
            <span style="font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px"><svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3L13 5" stroke="#151515" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>Found</span>
          </div>
        </sc-if>
        <sc-if value="{{ hasAlts }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ showAllMatches }}" style="align-self:flex-start;border:0;background:transparent;cursor:pointer;padding:2px 4px;font-size:14px;color:#6B6B6B;text-decoration:underline;text-underline-offset:3px">{{ altLabel }}</button>
        </sc-if>
        <sc-if value="{{ bizNotFound }}" hint-placeholder-val="{{ false }}">
          <div style="background:#F4F4F4;border-radius:16px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap">
            <div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;font-weight:500">{{ bizNfTitle }}</span><span style="font-size:13px;color:#6B6B6B">No problem — just paste the reviews directly.</span></div>
            <button onClick="{{ goManual }}" style="border:0;cursor:pointer;background:#151515;color:#fff;border-radius:14px;padding:14px 18px;font-size:15px;font-weight:500">Add reviews by link</button>
          </div>
        </sc-if>
      </div>
      <sc-if value="{{ showSkip }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ goManual }}" style="align-self:flex-start;border:0;background:transparent;cursor:pointer;padding:4px;font-size:14px;color:#6B6B6B;text-decoration:underline;text-underline-offset:3px">Can't find your business? Add reviews by link</button>
      </sc-if>
    </sc-if>

    <sc-if value="{{ showStep2 }}" hint-placeholder-val="{{ false }}">
      <sc-if value="{{ manualOnly }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:8px 4px">
        <h1 style="margin:0;font-size:clamp(34px,4vw,52px);font-weight:500;letter-spacing:-.04em;line-height:1"><span style="color:#9E9E9E">Paste the reviews</span> that should go.</h1>
        <button onClick="{{ openHelp }}" style="border:0;cursor:pointer;background:#FFFFFF;border-radius:14px;padding:6px 16px 6px 6px;font-size:14px;font-weight:500;color:#151515;display:flex;gap:10px;align-items:center"><span style="width:32px;height:32px;border-radius:10px;background:#151515;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 1.5v9l7-4.5z" fill="#fff"></path></svg></span>How to find the review link</button>
      </div>
      </sc-if>
      <sc-if value="{{ hasProfile }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:8px 4px">
        <h1 style="margin:0;font-size:clamp(34px,4vw,52px);font-weight:500;letter-spacing:-.04em;line-height:1"><span style="color:#9E9E9E">Tap the reviews</span> that should go.</h1>
        <span style="font-size:14px;color:#6B6B6B">{{ bizName }} · {{ selCount }} selected</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <div style="display:flex;background:#FFFFFF;border-radius:14px;padding:4px;gap:2px">
          <button onClick="{{ filterLow }}" style="border:0;cursor:pointer;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:500;background:{{ fLowBg }};color:{{ fLowFg }}">1–3 ★</button>
          <button onClick="{{ filterAll }}" style="border:0;cursor:pointer;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:500;background:{{ fAllBg }};color:{{ fAllFg }}">All</button>
        </div>
        <input value="{{ revSearch }}" onChange="{{ onRevSearch }}" placeholder="Search name or text" style="flex:1;min-width:180px;border:0;background:#FFFFFF;border-radius:14px;padding:13px 16px;font-size:15px;outline:none">
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <sc-if value="{{ reviewsLoading }}" hint-placeholder-val="{{ false }}">
          <div style="background:#FFFFFF;border-radius:20px;padding:18px;display:flex;align-items:center;gap:12px"><span style="width:38px;height:38px;border-radius:50%;background:#E4E4E4;flex:none"></span><div style="flex:1;display:flex;flex-direction:column;gap:8px"><span style="height:10px;width:40%;background:#E4E4E4;border-radius:5px;display:block"></span><span style="height:10px;width:80%;background:#E4E4E4;border-radius:5px;display:block"></span></div><span style="font-family:'Geist Mono',monospace;font-size:12px;color:#8A8A8A">loading reviews…</span></div>
        </sc-if>
        <sc-if value="{{ reviewsFailed }}" hint-placeholder-val="{{ false }}"><div style="background:#FFFFFF;border-radius:20px;padding:18px;font-size:15px;color:#6B6B6B">We couldn't load the reviews right now – add them by link below.</div></sc-if>
        <sc-for list="{{ profileReviews }}" as="p" hint-placeholder-count="5">
          <button onClick="{{ p.toggle }}" style="cursor:{{ p.cursor }};text-align:left;width:100%;background:#FFFFFF;border-radius:20px;padding:16px;display:flex;gap:14px;align-items:flex-start;border:2px solid {{ p.border }};opacity:{{ p.opacity }};font-size:14px;color:#151515">
            <span style="flex:none;width:26px;height:26px;border-radius:8px;margin-top:6px;display:flex;align-items:center;justify-content:center;background:{{ p.boxBg }};border:1.5px solid {{ p.boxBd }}"><svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3L13 5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
            <span style="width:38px;height:38px;border-radius:50%;background:#6B6B6B;color:#fff;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500">{{ p.initial }}</span>
            <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px">
              <span style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span style="font-size:15px;font-weight:500">{{ p.name }}</span><span style="font-size:13px;font-weight:500">{{ p.tag }}</span></span>
              <span style="font-size:13px;color:#6B6B6B"><span style="color:#151515;letter-spacing:1px">{{ p.starsOn }}</span><span style="color:#C8C8C8;letter-spacing:1px">{{ p.starsOff }}</span> · {{ p.when }}</span>
              <span style="font-size:14px;line-height:1.45;color:#333;text-wrap:pretty">{{ p.textShown }}</span>
            </span>
          </button>
        </sc-for>
        <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}"><div style="background:#FFFFFF;border-radius:20px;padding:24px;font-size:15px;color:#6B6B6B;text-align:center">No reviews match.</div></sc-if>
        <sc-if value="{{ reviewsPartial }}" hint-placeholder-val="{{ false }}"><div style="padding:4px 6px;font-size:13px;color:#6B6B6B">Showing the reviews Google shares publicly. Missing one? Add it by link below.</div></sc-if>
      </div>
      </sc-if>
      <div style="background:#FFFFFF;border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:10px">
        <sc-if value="{{ hasProfile }}" hint-placeholder-val="{{ true }}"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
          <button onClick="{{ toggleManual }}" style="border:0;background:transparent;cursor:pointer;font-size:15px;font-weight:500;color:#151515;padding:8px 4px">{{ manualLabel }}</button>
          <sc-if value="{{ showManual }}" hint-placeholder-val="{{ false }}"><button onClick="{{ openHelp }}" style="border:0;cursor:pointer;background:#F4F4F4;border-radius:14px;padding:6px 16px 6px 6px;font-size:14px;font-weight:500;color:#151515;display:flex;gap:10px;align-items:center"><span style="width:32px;height:32px;border-radius:10px;background:#151515;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 1.5v9l7-4.5z" fill="#fff"></path></svg></span>How to find the review link</button></sc-if>
        </div></sc-if>
        <sc-if value="{{ showManual }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;flex-direction:column;gap:10px">
      <sc-for list="{{ reviewItems }}" as="r" hint-placeholder-count="1">
        <div style="background:#FAFAFA;border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="flex:none;width:40px;height:40px;border-radius:12px;background:{{ r.badgeBg }};color:{{ r.badgeFg }};display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500">{{ r.badge }}</span>
            <input value="{{ r.value }}" onChange="{{ r.onValue }}" placeholder="Paste review link or text" style="flex:1;min-width:0;border:0;background:#F4F4F4;border-radius:14px;padding:14px 16px;font-size:16px;outline:none">
            <sc-if value="{{ r.canRemove }}" hint-placeholder-val="{{ false }}"><button onClick="{{ r.remove }}" aria-label="Remove" style="flex:none;width:40px;height:40px;border:0;cursor:pointer;background:transparent;border-radius:12px;color:#8A8A8A;font-size:20px">×</button></sc-if>
          </div>
          <sc-if value="{{ r.isLoading }}" hint-placeholder-val="{{ false }}">
            <div style="margin-left:50px;background:#F4F4F4;border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px">
              <span style="width:36px;height:36px;border-radius:50%;background:#E4E4E4;flex:none"></span>
              <div style="flex:1;display:flex;flex-direction:column;gap:8px"><span style="height:10px;width:40%;background:#E4E4E4;border-radius:5px;display:block"></span><span style="height:10px;width:80%;background:#E4E4E4;border-radius:5px;display:block"></span></div>
              <span style="font-family:'Geist Mono',monospace;font-size:12px;color:#8A8A8A">finding review…</span>
            </div>
          </sc-if>
          <sc-if value="{{ r.isFound }}" hint-placeholder-val="{{ false }}">
            <div style="margin-left:50px;background:#F4F4F4;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px">
              <div style="display:flex;align-items:center;gap:12px">
                <span style="width:36px;height:36px;border-radius:50%;background:#151515;color:#fff;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500">{{ r.pInitial }}</span>
                <div style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:15px;font-weight:500">{{ r.pName }}</span><span style="font-size:12px;color:#6B6B6B">{{ r.pMeta }}</span></div>
                <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px"><span style="font-size:14px;letter-spacing:1px">{{ r.pStarsOn }}<span style="color:#C8C8C8">{{ r.pStarsOff }}</span></span><span style="font-size:12px;color:#6B6B6B">{{ r.pWhen }}</span></div>
              </div>
              <p style="margin:0;font-size:15px;line-height:1.5;color:#333;text-wrap:pretty">{{ r.pText }}</p>
              <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:10px;border-top:1px solid #E4E4E4">
                <span style="font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px"><svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3L13 5" stroke="#151515" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>Review found</span>
                <button onClick="{{ r.clear }}" style="border:0;background:transparent;cursor:pointer;font-size:13px;color:#6B6B6B;text-decoration:underline;text-underline-offset:3px">Not this one?</button>
              </div>
            </div>
          </sc-if>
          <sc-if value="{{ r.needsName }}" hint-placeholder-val="{{ false }}">
            <div style="padding-left:50px"><input value="{{ r.name }}" onChange="{{ r.onName }}" placeholder="Reviewer's name" style="width:100%;border:0;background:#F4F4F4;border-radius:14px;padding:12px 16px;font-size:15px;outline:none"></div>
          </sc-if>
          <div style="padding-left:50px;display:flex;gap:6px;flex-wrap:wrap">
            <button onClick="{{ r.setRecent }}" style="cursor:pointer;border:0;border-radius:12px;padding:10px 14px;font-size:14px;display:flex;gap:8px;background:{{ r.recentBg }};color:{{ r.recentFg }}">Last 4 weeks<span style="font-weight:500">{{ priceRecent }}</span></button>
            <button onClick="{{ r.setOlder }}" style="cursor:pointer;border:0;border-radius:12px;padding:10px 14px;font-size:14px;display:flex;gap:8px;background:{{ r.olderBg }};color:{{ r.olderFg }}">Older<span style="font-weight:500">{{ priceOlder }}</span><span style="opacity:.7">· ~70% chance</span></button>
          </div>
        </div>
      </sc-for>
      <button onClick="{{ addReview }}" style="border:1px dashed #9E9E9E;background:transparent;cursor:pointer;border-radius:22px;padding:18px;font-size:16px;font-weight:500;color:#151515">+ Add another link</button>
          </div>
        </sc-if>
      </div>
    </sc-if>

    <sc-if value="{{ showStep3 }}" hint-placeholder-val="{{ false }}">
      <div style="padding:8px 4px"><h1 style="margin:0;font-size:clamp(34px,4vw,52px);font-weight:500;letter-spacing:-.04em;line-height:1"><span style="color:#9E9E9E">Where should we</span> reach you?</h1><sc-if value="{{ hasAuto }}" hint-placeholder-val="{{ false }}"><p style="margin:10px 0 0;font-size:15px;color:#555">Business details filled in from your Google profile — just add your name and email.</p></sc-if></div>
      <div style="background:#FFFFFF;border-radius:28px;padding:clamp(18px,2.4vw,28px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:16px">
        <div style="display:flex;flex-direction:column;gap:8px"><label style="font-size:14px;font-weight:500">Full name</label><input value="{{ name }}" onChange="{{ onName }}" style="border:1px solid #D2D2D2;background:#F7F7F7;border-radius:16px;padding:16px 18px;font-size:16px;outline:none;width:100%"></div>
        <div style="display:flex;flex-direction:column;gap:8px"><label style="font-size:14px;font-weight:500">Email</label><input type="email" value="{{ email }}" onChange="{{ onEmail }}" style="border:1px solid #D2D2D2;background:#F7F7F7;border-radius:16px;padding:16px 18px;font-size:16px;outline:none;width:100%"><sc-if value="{{ emailKnown }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;color:#151515;background:#EFEFEF;border-radius:12px;padding:10px 12px;line-height:1.45;display:flex;gap:8px;align-items:flex-start"><span style="font-weight:600">✓</span><span><strong style="font-weight:500">Welcome back!</strong> You already have an account — this order will be added to your dashboard. Use your existing login.</span></span></sc-if></div>
        <div style="display:flex;flex-direction:column;gap:8px"><label style="font-size:14px;font-weight:500;display:flex;justify-content:space-between;gap:8px"><span>Company</span><sc-if value="{{ autoCompany }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;font-weight:500;color:#6B6B6B">✓ from Google</span></sc-if></label><input value="{{ company }}" onChange="{{ onCompany }}" style="border:1px solid #D2D2D2;background:#F7F7F7;border-radius:16px;padding:16px 18px;font-size:16px;outline:none;width:100%"></div>
        <div style="display:flex;flex-direction:column;gap:8px"><label style="font-size:14px;font-weight:500;display:flex;justify-content:space-between;gap:8px"><span>Phone <span style="color:#8A8A8A;font-weight:400">— optional</span></span><sc-if value="{{ autoPhone }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;font-weight:500;color:#6B6B6B">✓ from Google</span></sc-if></label><input value="{{ phone }}" onChange="{{ onPhone }}" style="border:1px solid #D2D2D2;background:#F7F7F7;border-radius:16px;padding:16px 18px;font-size:16px;outline:none;width:100%"></div>

        this.api('account-profile', { body: { name: prof.name, company: prof.company, phone: prof.phone, street: prof.street, city: prof.zip, country: prof.country } }).then(r => {
          this.setState({ profBusy: false }); if (!r.ok) return expired(r) || this.accToast(this.accErr(r));
          this.setAccount(r.account); this.setState(st => ({ customer: st.customer ? { ...st.customer, name: r.account.name } : st.customer })); this.accToast('Profile saved'); }); },
      // email
      emailView: em === 'view', emailEdit: em === 'edit', emailPending: em === 'pending', pendingEmail: a.pendingEmail || '',
      startEmail: () => set({ emailMode: 'edit', newEmail: '', emailPw: '', emailErr: null }), cancelEmailEdit: () => set({ emailMode: 'view', emailErr: null }),
      saveEmail: () => { if (s.emailBusy) return; const n = (s.newEmail || '').trim().toLowerCase(); if (!vEm(n)) return set({ emailErr: 'invalid' }); set({ emailBusy: true });
        this.api('account-email', { body: { email: n, password: s.emailPw || '' } }).then(r => {
          if (!r.ok) { if (expired(r)) return; return set({ emailBusy: false, emailErr: r.error === 'wrong_password' ? 'pw' : r.error === 'email_taken' ? 'exists' : 'invalid' }); }
          this.setState({ emailBusy: false, emailMode: 'view', account: r.account, emailResent: false, emailPw: '' }); this.accToast('Confirmation link sent to ' + n); }); },
      resendEmail: () => { if (s.emailResent) return;
        if (!s.emailPw) return this.setState({ emailMode: 'edit', newEmail: a.pendingEmail, emailErr: null }, () => this.accToast('Enter your password to send the link again'));
        this.api('account-email', { body: { email: a.pendingEmail, password: s.emailPw } }).then(r => r.ok ? (set({ emailResent: true }), this.accToast('Confirmation link resent')) : (expired(r) || this.accToast(this.accErr(r)))); },
      cancelPending: () => this.api('account-email-cancel', { body: {} }).then(r => { if (!r.ok) return expired(r) || this.accToast(this.accErr(r)); this.setAccount(r.account); this.accToast('Email change cancelled'); }),
      // password
      savePw: () => { if (s.pwBusy) return; if (!s.pwCur) return set({ pwErr: 'cur' }); if ((s.pwNew || '').length < 10) return set({ pwErr: 'short' }); if (s.pwNew !== s.pwRep) return set({ pwErr: 'match' }); set({ pwBusy: true });
        this.api('account-password', { body: { current: s.pwCur, password: s.pwNew } }).then(r => {
          if (!r.ok) { if (expired(r)) return; return set({ pwBusy: false, pwErr: r.error === 'wrong_password' ? 'cur' : r.error === 'password_too_short' ? 'short' : null }); }
          set({ pwBusy: false, pwCur: '', pwNew: '', pwRep: '' }); this.accToast('Password changed – other devices were logged out'); }); },
      // sessions
      sessText: 'Lost a device or used a shared computer? Log out everywhere except here.',
      logoutAll: () => { if (s.sessBusy) return; set({ sessBusy: true });
        this.api('account-logout-all', { body: {} }).then(r => { set({ sessBusy: false }); if (!r.ok) return expired(r) || this.accToast(this.accErr(r)); this.accToast('Logged out on all other devices'); }); },
      // deletion
      delNone: !a.deletionRequestedAt, delDone: !!a.deletionRequestedAt, delDate: a.deletionRequestedAt ? today(a.deletionRequestedAt) : '',
      confirmDel: () => { if (s.delBusy) return; if (!s.delPw) return set({ delErr: true }); set({ delBusy: true });
        this.api('account-delete', { body: { password: s.delPw } }).then(r => {
          if (!r.ok) { if (expired(r)) return; return set({ delBusy: false, delErr: true }); }
          this.setState({ delBusy: false, delOpen: false, delPw: '', account: r.account }); this.accToast('Deletion requested – confirmation sent by email'); }); },
      // forgot password → reset link by email
      goForgot: e => { e && e.preventDefault && e.preventDefault(); set({ view: 'forgot', fpState: 'form', fpEmail: s.loginEmail || '', fpErr: false }); window.scrollTo({ top: 0 }); },
      sendReset: () => { const fpS = s.fpState || 'form'; if (fpS === 'loading') return; if (!vEm(s.fpEmail)) return set({ fpErr: true }); set({ fpState: 'loading' });
        this.api('reset', { body: { email: (s.fpEmail || '').trim() } }).then(r => set({ fpState: r.ok || r.error !== 'too_many_requests' ? 'sent' : 'form', fpErr: false })); },
      // set a new password (from /login/?reset=…)
      saveReset: () => { const rsS = s.rsState || 'form'; if (rsS === 'loading') return; if ((s.rsNew || '').length < 10) return set({ rsErr: 'short' }); if (s.rsNew !== s.rsRep) return set({ rsErr: 'match' }); set({ rsState: 'loading' });
        this.api('reset-confirm', { body: { token: s.rsToken, password: s.rsNew } }).then(r => {
          if (!r.ok) return set({ rsState: r.error === 'link_expired' ? 'expired' : 'form', rsErr: r.error === 'password_too_short' ? 'short' : null, rsResend: 'idle' });
          history.replaceState(null, '', '/login/');
          this.setAccount(r.account);
          this.setState({ rsState: 'done', rsNew: '', rsRep: '', rsToken: '', customer: r.customer, orders: r.orders || [], orderIdx: 0, portalIn: true, portalTab: 'overview' }); }); },
      resendReset: () => { if (s.rsResend && s.rsResend !== 'idle') return;
        const email = s.rsEmail || s.loginEmail || '';
        if (!vEm(email)) return set({ view: 'forgot', fpState: 'form', fpEmail: '' });
        set({ rsResend: 'loading' }); this.api('reset', { body: { email } }).then(() => set({ rsResend: 'sent' })); }
    });
  }

  realPortal() {
    // one dashboard for all of the customer's orders: reviews, payments and messages are merged
    const s = this.state, all = s.orders || [], o = all[0];
    if (!s.customer || !o) return null;
    const cur = o.currency, fmt = n => cur === 'EUR' ? `${Number(n).toLocaleString('en-US')} €` : `$${Number(n).toLocaleString('en-US')}`;
    const stMap = { submitted: 'submitted', in_progress: 'progress', removed: 'removed', not_eligible: 'cancelled', cancelled: 'stopped' };
    const isPaid = x => x.payment.status === 'paid';
    const withRemovals = all.filter(x => x.reviews.some(r => r.status === 'removed'));
    const open = all.filter(x => x.invoice.total > 0 && !isPaid(x));
    const paid = withRemovals.length > 0 && open.length === 0;
    const look = { removed: ['✓ Removed', '#151515', '#FFFFFF', '#151515'], progress: ['In progress', '#FFFFFF', '#151515', '#151515'], submitted: ['Submitted', '#EFEFEF', '#555', '#EFEFEF'], cancelled: ['Not eligible', '#FFFFFF', '#8A8A8A', '#D2D2D2'], stopped: ['Cancelled', '#FFFFFF', '#8A8A8A', '#D2D2D2'] };
    const many = all.length > 1;
    const items = [].concat(...all.map(x => x.reviews.map(r => {
      const st = stMap[r.status] || 'submitted', bulk = !!(x.invoice && x.invoice.bulk), price = bulk ? 50 : r.tier === 'older' ? 125 : 90, m = look[st], pd = isPaid(x);
      return { initial: (r.author || 'R')[0], name: r.author || 'Review', stars: r.stars || '–',
        when: (r.stars ? this.whenFor(r.days) : (r.tier === 'older' ? 'older than 4 weeks' : 'last 4 weeks')) + (many ? ' · ' + x.id : ''),
        text: r.text || r.link || 'Review link', st, price, bulk, orderId: x.id, paid: pd,
        textCol: st === 'removed' ? '#9E9E9E' : st === 'cancelled' ? '#8A8A8A' : '#333', deco: st === 'removed' ? 'line-through' : 'none',
        status: m[0], badgeBg: m[1], badgeFg: m[2], badgeBd: m[3],
        priceNote: (r.updatedAt && new Date(r.updatedAt).toDateString() === new Date().toDateString() ? '● Updated today · ' : '') + (st === 'removed' ? (pd ? 'Paid ' + fmt(price) : fmt(price) + ' due') : st === 'cancelled' || st === 'stopped' ? 'Cancelled · free' : fmt(price) + ' if removed') };
    })));
    const removed = items.filter(i => i.st === 'removed'), inProg = items.filter(i => i.st === 'progress').length;
    // invoice: the open (unpaid) orders, or – when everything is paid – all orders with removals
    const invOrders = open.length ? open : withRemovals, invIds = invOrders.map(x => x.id);
    const invItems = removed.filter(i => invIds.includes(i.orderId));
    const sum = k => invOrders.reduce((t, x) => t + (Number(x.invoice[k]) || 0), 0);
    const due = open.reduce((t, x) => t + (Number(x.invoice.total) || 0), 0), disc = invOrders.filter(x => !x.invoice.bulk).reduce((t, x) => t + (Number(x.invoice.discount) || 0), 0), rate = Math.max(0, ...invOrders.filter(x => !x.invoice.bulk).map(x => x.invoice.rate || 0)), anyBulk = invOrders.some(x => x.invoice.bulk);
    const dates = k => all.map(x => (x.timeline || {})[k]).filter(Boolean).sort();
    const tl = { received: all.map(x => x.createdAt).sort()[0], review: dates('review')[0], removed: dates('removed').pop(), paid: dates('paid').pop() };
    const fd = iso => iso ? new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—';
    const phase = paid ? 4 : removed.length ? 3 : (inProg || tl.review) ? 2 : 1;
    const allMsgs = [].concat(...all.map(x => x.messages || [])).sort((p, q) => String(p.at).localeCompare(String(q.at)));
    const msgs = allMsgs.map(m => ({ text: m.text, justify: m.from === 'me' ? 'flex-end' : 'flex-start', bg: m.from === 'me' ? '#151515' : '#F4F4F4', fg: m.from === 'me' ? '#FFFFFF' : '#151515',
      meta: (m.from === 'me' ? 'You' : 'byereviews team') + ' · ' + new Date(m.at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) }));
    const tab = s.portalTab || 'overview', lastTeam = allMsgs.filter(m => m.from === 'team').length, unread = tab !== 'support' && lastTeam > (s.seenTeamMsgs || 1);
    const goTab = t => { this.setState({ portalTab: t, seenTeamMsgs: t === 'support' ? lastTeam : s.seenTeamMsgs }); window.scrollTo({ top: 0 }); };
    // new messages go to the newest order that is still running
    const msgOrder = all.find(x => !x.cancelled) || o;
    const send = () => { const t = (s.supportDraft || '').trim(); if (!t) return; this.setState({ supportDraft: '' });
      this.api('message', { body: { order: msgOrder.id, text: t } }).then(r => { if (r.ok) this.setState({ orders: r.orders }); }); };
    const payable = all.filter(x => x.payment.canPay);
    const pay = () => { const x = payable[payable.length - 1]; if (x) location.href = '/order.php?a=pay&order=' + encodeURIComponent(x.id); };
    const oldest = all.filter(x => x.business.name === o.business.name).pop() || o;
    const rb = oldest.business.ratingBefore, rn = o.business.ratingNow;
    const isA = i => i.st === 'progress' || i.st === 'submitted', isD = i => !isA(i);
    const cancellable = all.filter(x => !x.cancelled && x.reviews.some(r => r.status === 'submitted' || r.status === 'in_progress'));
    return {
      pOrderId: '', pBiz: o.business.name || 'Your business', pFirst: (s.customer.name || '').split(' ')[0] || 'there', pEmail: s.customer.email,
      pRemoved: removed.length, pTotal: items.filter(i => i.st !== 'cancelled' && i.st !== 'stopped').length, pProgress: inProg,
      pRatingBefore: rb != null ? Number(rb).toFixed(1) : '–', pRatingNow: rn != null ? Number(rn).toFixed(1) : '–',
      pDue: fmt(due), pPayLabel: due > 0 ? 'Due now' + (anyBulk ? ' · bulk price' : rate > 0 ? ' · incl. volume discount' : '') : 'Nothing due' + (removed.length ? '' : ' yet'),
      pCanPay: payable.length > 0, pPaid: paid, payNow: pay,
      pSteps: [['Order received', fd(tl.received)], ['In review', phase >= 2 ? fd(tl.review || tl.received) : '—'], ['Removed', phase >= 3 ? fd(tl.removed) : '—'], ['Paid', phase >= 4 ? fd(tl.paid) : '—']]
        .map(([label, date], i) => ({ label, date, bar: i < phase ? '#151515' : '#E4E4E4', fg: i < phase ? '#151515' : '#8A8A8A' })),
      pReviews: items,
      ...(() => { const mob = (s.vw || 1200) < 760, t = s.rvTab || 'all';
        const f = { all: () => true, active: isA, done: isD }, list = items.filter(f[t]);
        return { rvTabs: [['all', 'All'], ['active', 'Active'], ['done', 'Done']].map(([k, label]) => ({ label, count: items.filter(f[k]).length, bg: t === k ? '#151515' : 'transparent', fg: t === k ? '#FFFFFF' : '#555', go: () => this.setState({ rvTab: k }) })),
          rvRows: list.map(i => ({ ...i, mobStars: mob ? ' · ' + i.stars + ' ★' : '', priceShort: i.st === 'cancelled' || i.st === 'stopped' ? '—' : fmt(i.price) })),
          rvEmpty: list.length === 0, rvEmptyText: t === 'done' ? 'No finished reviews yet.' : 'Nothing in progress.',
          rvCols: mob ? 'minmax(0,1fr) auto' : 'minmax(150px,1fr) 64px minmax(0,2.4fr) 96px 132px', rvGap: mob ? '8px 12px' : '16px' }; })(),
      pActive: items.filter(isA), pDone: items.filter(isD), pActiveCount: items.filter(isA).length, pDoneCount: items.filter(isD).length,
      pActiveEmpty: !items.some(isA), pDoneEmpty: !items.some(isD),
      pHasInvoice: invItems.length > 0, pInvoiceNo: invIds.map(id => 'INV-' + id.replace('BR-', '')).join(', '), pDueDate: fd(tl.removed),
      pLines: invItems.map(i => ({ label: i.name + ' · ' + (i.bulk ? 'bulk price (10+)' : i.price === 90 ? '≤ 4 weeks' : '> 4 weeks'), amount: fmt(i.price) })),
      pHasDisc: disc > 0, pDiscPct: Math.round(rate * 100) + '%', pDiscAmt: '– ' + fmt(disc), pInvTotal: fmt(sum('total')),
      pMsgs: msgs, sendSupport: send, onSupportKey: e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } },
      pTabOverview: tab === 'overview', pTabSupport: tab === 'support', pShowChatFab: tab === 'overview', pUnread: unread, openSupport: () => goTab('support'),
      pTabSettings: tab === 'settings', pNotSettings: tab !== 'settings',
      pCancelled: false, pCancelledAt: '',
      pCanCancel: cancellable.length > 0,
      cancelOpen: !!s.cancelOpen, cancelClosed: !s.cancelOpen, openCancel: () => this.setState({ cancelOpen: true }), closeCancel: () => this.setState({ cancelOpen: false, cancelReason: '' }),
      cancelReason: s.cancelReason || '', onCancelReason: e => this.setState({ cancelReason: e.target.value }),
      confirmCancel: () => { if (!confirm('Cancel your order? We stop working on all open reviews.')) return;
        const reason = s.cancelReason || '';
        cancellable.reduce((p, x) => p.then(acc => this.api('order-cancel', { body: { order: x.id, reason } }).then(r => r.ok ? r : (r.error === 'already_cancelled' ? acc : Promise.reject(r)))), Promise.resolve(null))
          .then(r => { this.setState({ orders: r ? r.orders : s.orders, cancelOpen: false, cancelReason: '', accNotice: 'Your order was cancelled – we sent you a confirmation.' }); window.scrollTo({ top: 0 }); })
          .catch(() => { alert('Could not cancel – please try again.'); this.api('me').then(r => r.ok && this.setState({ orders: r.orders || s.orders })); }); },
      pTabs: [['overview', 'Overview'], ['support', 'Support'], ['settings', 'Settings']].map(([k, label]) => ({ label, go: () => goTab(k), bg: tab === k ? '#151515' : 'transparent', fg: tab === k ? '#FFFFFF' : '#555', hasDot: k === 'support' && unread, dot: '1', dotBg: '#151515', dotFg: '#FFFFFF' })),
      logout: () => { this.api('logout', { body: {} }); this.setState({ portalIn: false, customer: null, orders: [], view: 'login', loginPass: '' }); window.scrollTo({ top: 0 }); }
    };
  }

  renderVals() {
    const s = this.state, v = this._designRenderVals();
    const ok = this.stepValid(s.step);
    // no Desktop/Mobile preview switcher on the live site
    Object.assign(v, { showSwitch: false, showFrame: false, showSite: true });
    const designNext = v.next;
    Object.assign(v, {
      next: () => (s.step === 4 && ok && !s.submitted) ? this.submitOrder() : designNext(),
      nextLabel: s.step === 4 ? (s.submitting ? 'Submitting…' : 'Submit order') : 'Continue',
      error: s.submitError || v.error, hasError: !!s.submitError || v.hasError, navInfo: s.submitError || v.navInfo,
      emailKnown: !!s.emailKnown,
      onEmail: e => { const email = e.target.value; this.setState({ email }); this.checkEmail(email.trim()); },
      hasAccNotice: !!s.accNotice && s.view === 'portal', accNotice: s.accNotice || '',
      loginErrorText: s.loginErrorText || "Email or password doesn't match.",
      loginBtn: s.loginBusy ? 'Logging in…' : 'Log in',
      doReset: () => this.doReset(), resetLabel: s.resetSent ? '✓ If an account exists for this address, a reset link is on its way (valid 1 h)' : 'Forgot your password?',
      openPortalAuto: () => { this.setState({ view: s.portalIn ? 'portal' : 'login', loginEmail: s.email, loginPass: '', loginError: false }); window.scrollTo({ top: 0 }); },
      successText: s.newAccount ? "We've created your personal dashboard and emailed your login details to " + s.email + '.' : 'This order was added to your existing account (' + s.email + '). Log in with your existing password.',
      reviewsLoading: s.reviewsStatus === 'loading', reviewsPartial: s.reviewsStatus === 'done' && !s.reviewsComplete, reviewsFailed: s.reviewsStatus === 'error',
      noResults: v.noResults && s.reviewsStatus !== 'loading',
      onBizQuery: e => this.onBizType(e.target.value),
      bizChoose: s.bizStatus === 'choose',
      chooseTitle: (s.places || []).length === 1 ? 'We found this profile – is it yours?' : 'We found ' + (s.places || []).length + ' profiles – select yours:',
      choosePlaces: (s.places || []).map(p => ({ initial: (p.name || '?')[0], name: p.name, meta: p.meta || p.address, go: () => this.pickPlace(p) })),
      hasAlts: s.bizStatus === 'found' && (s.places || []).length > 1,
      altLabel: 'Not your business? Show all ' + (s.places || []).length + ' matches',
      showAllMatches: () => this.setState({ bizStatus: 'choose', biz: null, selected: {}, placeReviews: [], reviewsStatus: 'idle' }),
      bizNfTitle: s.searchError ? 'Search is unavailable right now' : 'No profile found',
      ...this.heroVals()

    const real = this.realPortal();
    if (real) {
      Object.assign(v, real);
      // the design builds the eyebrow from its demo order; use the real one
      if (v.acc && (s.portalTab || 'overview') !== 'settings') v.acc.eyebrow = '// dashboard · ' + (s.account ? s.account.email : '');
    }
    else Object.assign(v, { pCanCancel: false, pCancelled: false, pOrderId: '', pBiz: '', pFirst: 'there', pEmail: '' });
    return v;
  }

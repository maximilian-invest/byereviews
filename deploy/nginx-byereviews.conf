# /etc/nginx/sites-available/byereviews  (reference copy; certbot adds the 443/SSL parts on the server)
server {
    listen 80;
    listen [::]:80;
    server_name byereviews.com www.byereviews.com;
    root /var/www/byereviews/public;
    index index.html;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # stored orders and dotfiles are never public
    location ^~ /orders/ { deny all; return 404; }
    location ~ /\. { deny all; return 404; }

    location = /order.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ { return 404; }

    location /assets/ { expires 30d; access_log off; }
    # HTML must always be revalidated, otherwise browsers show outdated versions after a deploy
    location ~* \.html$ { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; }
    location / { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; try_files $uri $uri.html $uri/ =404; }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml text/xml;
}

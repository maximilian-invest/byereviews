# /etc/nginx/sites-available/byereviews.com  (site files in /var/www/byereviews = contents of public/)
server {
    listen 80;
    listen [::]:80;
    server_name byereviews.com www.byereviews.com;
    return 301 https://byereviews.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.byereviews.com;
    ssl_certificate     /etc/letsencrypt/live/byereviews.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/byereviews.com/privkey.pem;
    return 301 https://byereviews.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name byereviews.com;
    ssl_certificate     /etc/letsencrypt/live/byereviews.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/byereviews.com/privkey.pem;

    root /var/www/byereviews;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # stored orders and dotfiles are never public
    location ^~ /orders/ { deny all; return 404; }
    location ~ /\. { deny all; return 404; }

    location = /order.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;   # adjust to the installed PHP version, e.g. php8.3-fpm.sock
    }
    location ~ \.php$ { return 404; }

    location ~* \.(png|webp|mp4|woff2)$ { expires 30d; access_log off; }
    location ~* \.(css|js)$ { expires 7d; }

    location / { try_files $uri $uri/ =404; }
}

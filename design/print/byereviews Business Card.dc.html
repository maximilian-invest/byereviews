<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>doc-page:not(:defined){visibility:hidden}body{margin:0;font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}a:hover{color:inherit}</style>
<script src="./doc-page.js"></script>
</helmet>
<doc-page width="91mm" height="61mm">
  <section class="page" data-screen-label="Card front" style="background:#151515;color:#FFFFFF;position:relative;overflow:hidden;font-family:'Geist',sans-serif">
    <div style="position:absolute;inset:0;background:#151515 url('assets/blog/01-how-to-remove-a-google-review.png') 70% center/cover;opacity:.55"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(90deg,#151515 25%,rgba(21,21,21,.2) 75%)"></div>
    <div style="position:absolute;left:8mm;top:8mm;right:8mm;bottom:8mm;display:flex;flex-direction:column;justify-content:space-between">
      <img src="assets/byereviews-logo.png" alt="byereviews" style="height:5.2mm;width:auto;align-self:flex-start;filter:invert(1)">
      <div style="display:flex;flex-direction:column;gap:1.4mm">
        <span style="font-size:11pt;font-weight:600;letter-spacing:-.02em;line-height:1.1"><span style="color:#8A8A8A">Unfaire Google-Bewertung?</span><br>Wir lassen sie löschen.</span>
        <span style="font-family:'Geist Mono',monospace;font-size:6pt;color:#B5B5B5;letter-spacing:.04em">NUR BEI ERFOLG ZAHLEN</span>
      </div>
    </div>
  </section>
  <section class="page" data-screen-label="Card back" style="background:#FFFFFF;color:#151515;position:relative;font-family:'Geist',sans-serif">
    <div style="position:absolute;left:8mm;top:8mm;right:8mm;bottom:8mm;display:flex;justify-content:space-between;gap:4mm">
      <div style="display:flex;flex-direction:column;justify-content:space-between;min-width:0">
        <div style="display:flex;flex-direction:column;gap:.8mm">
          <span style="font-size:11pt;font-weight:600;letter-spacing:-.02em">Maximilian</span>
          <span style="font-size:7pt;color:#6B6B6B">Gründer, byereviews</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:1mm;font-size:7pt;line-height:1.3">
          <span>info@byereviews.com</span>
          <span>0664 260 0930</span>
          <span style="font-weight:600">byereviews.com</span>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:space-between;flex:none">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=0&color=151515&bgcolor=ffffff&data=https%3A%2F%2Fbyereviews.com" alt="QR byereviews.com" style="width:19mm;height:19mm;display:block">
        <span style="font-size:5.5pt;color:#6B6B6B;text-align:center;line-height:1.3">Kostenloser<br>Check</span>
      </div>
    </div>
  </section>
</doc-page>
</x-dc>
</body>
</html>
